name: Test

on:
  push:
    branches: [main, example/**]
  pull_request:
  workflow_dispatch:

# リポジトリの内容を読む権限だけを渡す。
permissions:
  contents: read

# 同じブランチで新しい実行が始まったら、古い実行を止める。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build the containers and install the packages
        run: make setup
      - name: Start the containers
        run: docker compose up -d --wait
      - name: Check the code
        run: make py/check
      - name: Run the tests
        run: make py/test
      - name: Call the API through the real database
        run: bash scripts/smoke.sh
      - name: Show the logs when something failed
        if: failure()
        run: docker compose logs
