version: 2
updates:
  # Python のパッケージ（pyproject.toml、poetry.lock）
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      python:
        patterns: ["*"]
  # Python のイメージ（Dockerfile）
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    ignore:
      # Python のバージョン（3.15 → 3.16 など）は、ほかのファイルと合わせて、手で上げる。
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  # MySQL のイメージ（docker-compose.yaml）
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    ignore:
      # MySQL は LTS を使う。メジャーバージョンの更新は、手で行う。
      - dependency-name: mysql
        update-types: ["version-update:semver-major"]
  # GitHub Actions のアクション
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      actions:
        patterns: ["*"]
