version: 2
updates:
  # Python のパッケージ（pyproject.toml、poetry.lock）
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      python:
        patterns: ["*"]
  # Python のイメージ（Dockerfile）
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
  # MySQL のイメージ（docker-compose.yaml）
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    ignore:
      # MySQL は長期サポート版を使う。メジャーバージョンの更新は、手で行う。
      - dependency-name: mysql
        update-types: ["version-update:semver-major"]
  # GitHub Actions のアクション
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      actions:
        patterns: ["*"]
