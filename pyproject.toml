[project]
name = "sandbox-fastapi"
version = "0.1.0"
description = "FastAPI による Web API のひな形"
readme = "README.md"
requires-python = ">=3.15,<4.0"
dependencies = ["fastapi (>=0.165.0,<0.166.0)", "uvicorn[standard] (>=0.54.0,<0.55.0)", "sqlalchemy[asyncio] (>=2.1.9,<3.0.0)", "pymysql (>=1.2.4,<2.0.0)", "aiomysql (>=0.3.2,<0.4.0)"]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio (>=1.5.0,<2.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.17.6,<0.18.0)"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
