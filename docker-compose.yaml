services:
  api:
    build: .
    # 手元のパソコンと同じユーザーで動かす。番号は、Makefile が調べて渡す。
    # root で動かすと、Linux では、コンテナが作ったファイル（.dockervenv、__pycache__ など）が
    # root の持ち物になり、手元で消せなくなる。
    user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
    volumes:
      - .dockervenv:/src/.venv
      - .:/src
    ports:
      # 手元のパソコンからだけつなげるように、127.0.0.1 を付ける。
      # 付けないと、同じネットワークのほかの機器からもつなげてしまう。
      - 127.0.0.1:8000:8000
    environment:
      - WATCHFILES_FORCE_POLLING=true
      - DB_HOST=db
      - DB_NAME=demo
      - DB_USER=root
      - DB_ECHO=true
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_DATABASE: 'demo'
      TZ: 'Asia/Tokyo'
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - 127.0.0.1:33306:3306
    healthcheck:
      # -h 127.0.0.1 で、ネットワーク経由の接続を確かめる。
      # localhost だと、初期化の途中の、まだ外からつなげない状態でも成功してしまう。
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
volumes:
  mysql_data:
